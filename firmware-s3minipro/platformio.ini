; =====================================================================
;  Sera-vice firmware v1 - LOLIN S3 Mini Pro (ESP32-S3FH4R2)
; =====================================================================
;  Board note: espressif32 has no "lolin_s3_mini_pro" board def, so we
;  build for lolin_s3_mini - the same ESP32-S3FH4R2 board (4 MB QIO
;  flash, 2 MB QSPI PSRAM, native USB) without the Pro's display/IMU
;  populated. Every Pro peripheral pin is defined in src/board_pins.h,
;  so nothing depends on the variant header.
;
;  LOLIN ships this board with TWO panel variants (ST7789 or GC9A01 -
;  wemos.cc S3 MINI PRO docs), one env per panel:
;     pio run                          build both
;     pio run -e s3minipro_gc9a01 -t upload    flash (try this first)
;     pio run -e s3minipro_st7789 -t upload    flash (if screen is wrong)

[platformio]
default_envs = s3minipro_gc9a01, s3minipro_st7789

[common]
; TFT_eSPI config passed as build flags (USER_SETUP_LOADED), transcribed
; from LOLIN's own TFT_eSPI fork (github.com/wemos/TFT_eSPI),
; User_Setups/Setup404_LOLIN_S3_MINI_PRO.h and Setup406_..._ST7789.h.
; No library files are edited.
tft_flags =
    -DUSER_SETUP_LOADED
    -DUSE_HSPI_PORT
    -DCGRAM_OFFSET
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=128
    -DTFT_MISO=39
    -DTFT_MOSI=38
    -DTFT_SCLK=40
    -DTFT_CS=35
    -DTFT_DC=36
    -DTFT_RST=34
    -DTFT_BL=33
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

[env]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; v2: custom partition table (single app slot + 1 MB themepack data
; partition at 0x200000, NVS preserved - see partitions.csv).
; NOTE: do NOT set board_build.flash_mode/f_flash here - the Arduino
; package ships no prebuilt dio_40m bootloader for this chip, so the
; build fails looking for one. Exactly as in v1, the DIO / 40 MHz
; stamp (the only mode this rev v0.2 chip boots) is applied by
; esptool merge-bin when the full-flash image is made (see README).
board_build.partitions = partitions.csv
lib_deps =
    https://github.com/wemos/TFT_eSPI.git
    https://github.com/LiquidCGS/FastIMU.git

[env:s3minipro_gc9a01]
build_flags =
    ${common.tft_flags}
    -DGC9A01_DRIVER
    -DSERA_PANEL_GC9A01

[env:s3minipro_st7789]
build_flags =
    ${common.tft_flags}
    -DST7789_2_DRIVER
    -DTFT_RGB_ORDER=TFT_BGR
    -DSERA_PANEL_ST7789
